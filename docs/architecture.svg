<svg viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563" />
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="560" fill="#ffffff" />

  <!-- Client -->
  <rect x="380" y="20" width="160" height="50" rx="8" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5" />
  <text x="460" y="50" text-anchor="middle" font-size="15" fill="#1e1b4b">Clinician / client</text>

  <!-- api -->
  <rect x="120" y="140" width="160" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5" />
  <text x="200" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">api</text>
  <text x="200" y="184" text-anchor="middle" font-size="11" fill="#1e3a8a">REST + webhooks</text>

  <!-- worker -->
  <rect x="380" y="140" width="160" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5" />
  <text x="460" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">worker</text>
  <text x="460" y="184" text-anchor="middle" font-size="11" fill="#14532d">consumers + outbox relay</text>

  <!-- externallab -->
  <rect x="640" y="140" width="160" height="60" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
  <text x="720" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#78350f">externallab</text>
  <text x="720" y="184" text-anchor="middle" font-size="11" fill="#78350f">fake laboratory provider</text>

  <!-- Postgres -->
  <rect x="60" y="300" width="160" height="60" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5" />
  <text x="140" y="325" text-anchor="middle" font-size="15" font-weight="600" fill="#4c1d95">PostgreSQL</text>
  <text x="140" y="344" text-anchor="middle" font-size="11" fill="#4c1d95">system of record</text>

  <!-- RabbitMQ -->
  <rect x="380" y="300" width="160" height="60" rx="8" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5" />
  <text x="460" y="325" text-anchor="middle" font-size="15" font-weight="600" fill="#881337">RabbitMQ</text>
  <text x="460" y="344" text-anchor="middle" font-size="11" fill="#881337">events, retry, DLQ</text>

  <!-- Redis -->
  <rect x="700" y="300" width="160" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" />
  <text x="780" y="325" text-anchor="middle" font-size="15" font-weight="600" fill="#7f1d1d">Redis</text>
  <text x="780" y="344" text-anchor="middle" font-size="11" fill="#7f1d1d">idempotency locks</text>

  <!-- Arrows -->
  <line x1="440" y1="70" x2="260" y2="138" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="380" y="105" font-size="11" fill="#374151">REST</text>

  <line x1="200" y1="200" x2="150" y2="298" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="130" y="255" font-size="11" fill="#374151">writes + outbox</text>

  <line x1="230" y1="185" x2="700" y2="325" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="330" y="150" font-size="11" fill="#374151">idempotency lock</text>

  <line x1="460" y1="200" x2="460" y2="298" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="470" y="255" font-size="11" fill="#374151">consume / publish</text>

  <line x1="150" y1="330" x2="378" y2="330" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 3" />
  <text x="200" y="320" font-size="11" fill="#374151">polls outbox_events</text>

  <line x1="540" y1="170" x2="638" y2="170" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="545" y="160" font-size="11" fill="#374151">circuit breaker + retry</text>

  <line x1="700" y1="150" x2="282" y2="150" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 3" />
  <text x="440" y="128" font-size="11" fill="#374151">signed results webhook</text>

  <!-- Legend -->
  <rect x="60" y="460" width="14" height="14" fill="#dbeafe" stroke="#1d4ed8" />
  <text x="82" y="472" font-size="12" fill="#111827">API process (no direct RabbitMQ dependency)</text>

  <rect x="60" y="486" width="14" height="14" fill="#dcfce7" stroke="#15803d" />
  <text x="82" y="498" font-size="12" fill="#111827">Worker process (RabbitMQ consumers + outbox relay)</text>

  <rect x="60" y="512" width="14" height="14" fill="#fef3c7" stroke="#b45309" />
  <text x="82" y="524" font-size="12" fill="#111827">Fake external laboratory (stands in for a real provider)</text>
</svg>
