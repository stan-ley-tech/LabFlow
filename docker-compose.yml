services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labflow}
      POSTGRES_USER: ${POSTGRES_USER:-labflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - labflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-labflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-labflow}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - labflow_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - labflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    command: node cmd/server/index.js
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      target: runtime
    command: node cmd/worker/index.js
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      EXTERNAL_LAB_BASE_URL: http://externallab:4000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  externallab:
    build:
      context: .
      target: runtime
    command: node cmd/externallab/index.js
    env_file:
      - .env
    environment:
      EXTERNAL_LAB_PORT: 4000
      LABFLOW_WEBHOOK_URL: http://api:3000/webhooks/laboratory/results
    ports:
      - "${EXTERNAL_LAB_PORT:-4000}:4000"

volumes:
  labflow_postgres_data:
  labflow_rabbitmq_data:
  labflow_redis_data:
